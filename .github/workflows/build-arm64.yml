name: Build MC Native Image (arm64)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      mode:
        description: 'Build mode'
        required: true
        default: 'both'
        type: choice
        options:
          - server
          - client
          - both
      mc_version:
        description: 'Minecraft version'
        required: true
        default: '1.20.1'

env:
  GRAALVM_TAG: "gluon-23+25.1-dev-2409082136"
  LABS_JDK_TAG: "jvmci-25.1-b19"
  LABS_JDK_VERSION: "labsjdk-ce-25.0.3+9"

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 180

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Add swap space (4GB)
        run: |
          sudo diskutil apfs addVolume disk1 "Case-sensitive APFS" swap -quota 4G 2>/dev/null || \
          sudo mkdir -p /Volumes/swap
          # Try creating swap via hdiutil
          sudo hdiutil attach -nobrowse -nomount -size 4g -type SPARSE /tmp/swapfile.dmg 2>/dev/null || true
          # Fallback: use macOS vm_stat info and reduce memory pressure
          echo "System memory:"
          sysctl hw.memsize | awk '{print $2/1024/1024/1024 " GB"}'
          vm_stat | head -5

      - name: Download Gluon GraalVM
        run: |
          set -e
          GRAALVM_DIR="$HOME/graalvm"
          STAGING="$HOME/graalvm-staging"
          mkdir -p "$GRAALVM_DIR" "$STAGING"

          echo "Downloading Gluon GraalVM $GRAALVM_TAG..."
          curl -sL "https://github.com/gluonhq/graal/releases/download/${GRAALVM_TAG}/graalvm-java23-darwin-aarch64-gluon-23+25.1-dev.tar.gz" \
            -o /tmp/graalvm.tar.gz

          echo "Extracting to staging..."
          tar -xzf /tmp/graalvm.tar.gz -C "$STAGING/"

          EXTRACTED=$(ls -d "$STAGING"/*/ | head -1)
          echo "Found extracted dir: $EXTRACTED"

          if [[ -d "$EXTRACTED/Contents/Home" ]]; then
            cp -R "$EXTRACTED/Contents/Home/"* "$GRAALVM_DIR/"
          else
            cp -R "$EXTRACTED"* "$GRAALVM_DIR/"
          fi

          echo "GRAALVM_HOME=$GRAALVM_DIR" >> $GITHUB_ENV
          echo "$GRAALVM_DIR/bin" >> $GITHUB_PATH
          rm -f /tmp/graalvm.tar.gz
          rm -rf "$STAGING"

      - name: Download labs-openjdk static libs
        run: |
          set -e
          STAGING="$HOME/labsjdk-staging"
          mkdir -p "$STAGING"

          curl -sL "https://github.com/graalvm/labs-openjdk/releases/download/${LABS_JDK_TAG}/${LABS_JDK_VERSION}-${LABS_JDK_TAG}-darwin-aarch64.tar.gz" \
            -o /tmp/labsjdk.tar.gz

          tar -xzf /tmp/labsjdk.tar.gz -C "$STAGING/"
          LABS_DIR=$(ls -d "$STAGING"/*/ | head -1)

          STATIC_SRC="$LABS_DIR/Contents/Home/lib/static/darwin-aarch64"
          STATIC_DST="$GRAALVM_HOME/lib/static/darwin-aarch64"

          mkdir -p "$STATIC_DST"
          cp "$STATIC_SRC"/*.a "$STATIC_DST/"
          echo "Copied $(ls "$STATIC_DST"/*.a | wc -l) static libraries"

          rm -f /tmp/labsjdk.tar.gz
          rm -rf "$STAGING"

      - name: Verify GraalVM
        run: |
          echo "GRAALVM_HOME=$GRAALVM_HOME"
          "$GRAALVM_HOME/bin/java" -version 2>&1 | head -1
          "$GRAALVM_HOME/bin/native-image" --version 2>&1 | head -1
          echo "Static libs: $(ls "$GRAALVM_HOME/lib/static/darwin-aarch64/"*.a 2>/dev/null | wc -l) files"

      - name: Determine build mode
        id: mode
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "mode=${{ github.event.inputs.mode }}" >> $GITHUB_OUTPUT
            echo "mc_version=${{ github.event.inputs.mc_version }}" >> $GITHUB_OUTPUT
          else
            echo "mode=server" >> $GITHUB_OUTPUT
            echo "mc_version=1.20.1" >> $GITHUB_OUTPUT
          fi

      - name: Fetch Minecraft
        run: |
          bash scripts/fetch_minecraft.sh ${{ steps.mode.outputs.mc_version }}

      - name: Build server native image
        if: steps.mode.outputs.mode == 'server' || steps.mode.outputs.mode == 'both'
        run: |
          bash scripts/build_native_desktop.sh server ${{ steps.mode.outputs.mc_version }}

      - name: Build client native image
        if: steps.mode.outputs.mode == 'client' || steps.mode.outputs.mode == 'both'
        run: |
          bash scripts/build_native_desktop.sh client ${{ steps.mode.outputs.mc_version }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mc-${{ steps.mode.outputs.mc_version }}-native-arm64
          path: |
            ${{ github.workspace }}/build/minecraft/*-native
          retention-days: 7
          if-no-files-found: warn
